name: Publish Android Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version Name (e.g. 1.0.0)'
        required: true
      versionCode:
        description: 'Version Code (e.g. 2)'
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a GitHub Release
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi, i686-linux-android
          
      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Update Version in build.gradle.kts
        run: |
          sed -i 's/versionName = ".*/versionName = "${{ github.event.inputs.versionName }}"/' android/app/build.gradle.kts
          sed -i 's/versionCode = .*/versionCode = ${{ github.event.inputs.versionCode }}/' android/app/build.gradle.kts

      - name: Build Release APK and AAB
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease

      # We use a community action to sign the artifacts so you don't have to put secrets in build.gradle
      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.versionName }}
          name: Harper Android v${{ github.event.inputs.versionName }}
          generate_release_notes: true
          files: |
            ${{steps.sign_apk.outputs.signedReleaseFile}}
            ${{steps.sign_aab.outputs.signedReleaseFile}}