name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/harper-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Run Lint
        working-directory: android
        run: ./gradlew lint
      - name: Build Host Rust Library
        working-directory: rust/harper-android
        run: cargo build --release
      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest -PciArch=x86_64
      - name: Assemble Debug
        working-directory: android
        run: ./gradlew assembleDebug -PciArch=x86_64
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results.html
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
